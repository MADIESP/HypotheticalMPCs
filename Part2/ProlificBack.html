{% block content %}

<style>
    .end-container {
        max-width: 600px;
        margin: 60px auto;
        padding: 40px;
        text-align: center;
        border: 1px solid #ddd;
        border-radius: 8px;
        background-color: #fafafa;
    }

    .end-container h2 {
        margin-bottom: 10px;
    }

    .end-container h3 {
        margin-top: 30px;
        margin-bottom: 20px;
        font-weight: normal;
    }

    .payoff {
        font-size: 1.1em;
        margin: 8px 0;
    }

    .total {
        font-size: 1.4em;
        font-weight: bold;
        margin-top: 25px;
    }
     .amount {
        color: #c00000;   /* dark red, readable */
        font-weight: bold;
    }
</style>

<div class="end-container">

    <h2>You are being redirected to Prolific...</h2>

</div>

<script>
    let completionlink = js_vars.completionlink;

    window.onload = function(){
        window.location.href=completionlink;
    }
</script>

{% endblock %}
