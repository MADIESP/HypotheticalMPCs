{% block content %}

<style>
    .end-container {
        max-width: 600px;
        margin: 60px auto;
        padding: 40px;
        text-align: center;
        border: 1px solid #ddd;
        border-radius: 8px;
        background-color: #fafafa;
    }

    .end-container h2 {
        margin-bottom: 10px;
    }

    p {
        font-size: 1.05em;
        line-height: 1.6;
    }
</style>

<div class="end-container">

    <h2>The survey is now over</h2>
    <h2>Thank you for your participation!</h2>

    <p>
        Please click Next to return to Prolific and receive your payment.
    </p>

    <button class="btn btn-danger btn-submit" type="submit">
        Next
    </button>
</div>

{% endblock %}
